name: Rebuild Pages (only HTML)

# CHỈ chạy tay. Trước đây tự chạy mỗi khi sửa build_pages.py và dựng lại trang khi chưa có
# output/breadth_groups.json -> ghi đè trang bằng BREADTH_DATA = null (mất nhóm ngành + đường chỉ số).
# Workflow "VN-Index and MA Ratio Analysis" đã tự dựng trang sau mỗi lần build, nên thường không cần workflow này.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build_pages.py (tự dừng nếu thiếu output/breadth_groups.json)
        run: python build_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Rebuild docs/index.html via rebuild_pages workflow [skip ci]"
          git pull --rebase --autostash origin main || true
          git push

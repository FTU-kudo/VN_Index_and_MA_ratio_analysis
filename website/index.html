<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VN-Index & MA Market Breadth</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 16px; background: #fff; }
    header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap: 12px; }
    .pill { border: 1px solid #ddd; border-radius: 999px; padding: 10px 12px; background: #fafafa; }
    .grid { display:grid; grid-template-columns: 1fr; gap: 12px; }
    #chart { width: 100%; height: 72vh; }
    label { font-weight: 600; font-size: 14px; }
    .checks { display:flex; gap: 10px; flex-wrap:wrap; align-items:center; margin-top: 6px; }
    .checks label { font-weight: 500; }
    .footer { margin-top: 10px; font-size: 12px; color: #666; }
    a { color: #0b57d0; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>VN-Index & Market Breadth (MA10/20/50/200)</h1>
    <div class="controls pill">
      <label for="plot-range">MA lines to show</label>
      <div class="checks" id="maChecks" aria-label="MA line checkboxes">
        <label><input type="checkbox" value="pct_MA10" checked /> MA10</label>
        <label><input type="checkbox" value="pct_MA20" checked /> MA20</label>
        <label><input type="checkbox" value="pct_MA50" checked /> MA50</label>
        <label><input type="checkbox" value="pct_MA200" checked /> MA200</label>
      </div>
    </div>
  </header>

  <div class="grid">
    <div id="chart"></div>
    <div class="footer">
      Data source: generated by <code>analysis.py</code>. This page expects <code>data/market_breadth_daily.json</code> to exist.
    </div>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script>
    const CHECKBOXES = Array.from(document.querySelectorAll('#maChecks input[type="checkbox"]'));

    const COLORS = {
      pct_MA10: 'cyan',
      pct_MA20: 'red',
      pct_MA50: 'green',
      pct_MA200: 'orange'
    };

    const NAMES = {
      pct_MA10: 'MA10',
      pct_MA20: 'MA20',
      pct_MA50: 'MA50',
      pct_MA200: 'MA200'
    };

    async function loadData() {
      // The website should include data/market_breadth_daily.json in the GitHub Pages build.
      // Path is relative to this page (works when website/ is the Pages root).
      const res = await fetch('data/market_breadth_daily.json');

      if (!res.ok) throw new Error('Failed to load data JSON: ' + res.status);
      return res.json();
    }

    function buildTraces(dayRows, selectedKeys) {
      const x = dayRows.map(r => r.time);
      const vn = dayRows.map(r => r.VNINDEX);

      const traces = [
        {
          x,
          y: vn,
          name: 'VNINDEX (left axis)',
          mode: 'lines',
          line: { color: 'purple', width: 2 },
          yaxis: 'y'
        }
      ];

      for (const key of selectedKeys) {
        traces.push({
          x,
          y: dayRows.map(r => r[key]),
          name: `Tỷ lệ mã > ${NAMES[key]} (%, right axis)`,
          mode: 'lines',
          line: { color: COLORS[key], width: 1 },
          yaxis: 'y2'
        });
      }
      return traces;
    }

    function getSelectedKeys() {
      return CHECKBOXES.filter(cb => cb.checked).map(cb => cb.value);
    }

    function render(dayRows) {
      const selectedKeys = getSelectedKeys();
      const traces = buildTraces(dayRows, selectedKeys);

      const layout = {
        title: 'VN-Index & Market Breadth',
        font: { family: 'Inter, Roboto, Arial, sans-serif' },
        legend: { orientation: 'h', yanchor: 'bottom', y: -0.2, xanchor: 'center', x: 0.5 },
        hovermode: 'x unified',
        margin: { l: 60, r: 60, t: 60, b: 140 },
        xaxis: { title: 'Thời gian' },
        yaxis: { title: 'VN-Index (điểm)', showgrid: false },
        yaxis2: {
          title: 'Tỷ lệ (%)',
          overlaying: 'y',
          side: 'right',
          range: [0, 100],
          ticksuffix: '%',
          showgrid: true,
          gridcolor: 'gray',
          gridwidth: 0.5,
          griddash: 'dot'
        },
        template: 'plotly_white'
      };

      const config = { responsive: true, displayModeBar: false };
      Plotly.newPlot('chart', traces, layout, config);
    }

    async function main() {
      const dayRows = await loadData();
      // Ensure numeric values
      for (const r of dayRows) {
        for (const k of Object.keys(COLORS)) {
          r[k] = Number(r[k]);
        }
        r.VNINDEX = Number(r.VNINDEX);
      }
      render(dayRows);

      for (const cb of CHECKBOXES) {
        cb.addEventListener('change', () => render(dayRows));
      }
    }

    main().catch(err => {
      console.error(err);
      document.getElementById('chart').innerHTML = '<pre style="white-space:pre-wrap;color:#b00020">' + String(err) + '</pre>';
    });
  </script>
</body>
</html>
